lab: 4
goal: 在Lab3中断基础上运行首个用户进程并形成ecall往返。
requires: lab3的启动、控制台、自旋锁、物理内存、内核页表与设备中断基础。
changes:
  kernel/process:
  - 首进程页表与上下文
  - 当前CPU进程指针
  - swtch与proc_return
  kernel/usertrap:
  - user_vector、trap_user_handler、trap_user_return、user_return
  kernel/memory:
  - TRAMPOLINE与KSTACK(0)
  - 可恢复页分配和映射失败
  kernel/boot:
  - 初始化进程并由hart0启动
  user/initcode:
  - 连续两次ecall与用户循环
  toolchain:
  - 用户入口与内嵌代码
  - trampoline段及新增源文件构建
acceptance:
- scenario: 首进程ecall往返
  input: 以CPUNUM=2和OpenSBI默认固件启动默认用户入口
  expected:
  - 出现两次proczero hello world
  - 用户调用都返回0且继续循环，ecall不重复执行
- scenario: 用户执行期间中断
  input: 用户循环期间等待时钟并向UART输入普通字符、退格和换行
  expected:
  - 时钟继续推进，UART按console契约回显
  - 中断后用户PC、寄存器和栈保持可继续执行
- scenario: 未知调用与用户异常
  input: 临时用户场景发起未知号及访问零页
  expected:
  - 未知号返回-1，用户零页错误停止故障执行而不panic

- scenario: 资源不足与失败回滚
  input: 在尚未发布的页表和首进程构造中逐次注入分配失败，并测试物理页池耗尽
  expected:
  - 分配或映射返回失败，不 panic；调用前映射保留，临时页全部回收
  - 首进程未完成时 cpu.proc 保持 NULL，内核及用户空闲页计数恢复原值

- scenario: 用户现场跨异步中断恢复
  input: TESTING=1 的用户汇编探针为整数寄存器设置哨兵，等待 ticks>=3，期间注入 UART 字符、退格和回车
  expected:
  - 时钟和 UART 均从用户态进入；全部哨兵和用户栈保持，用户报告检查通过
  - 测试专用调用98和99只存在于 LAB4_TEST 镜像，默认镜像将这些调用作为未知号返回-1

- scenario: 用户权限边界
  input: 用户尝试写代码页、读取 TRAPFRAME 和跳转到内核入口
  expected:
  - 分别产生 store/load/instruction page fault，故障地址与请求一致
  - 故障进程资源完整回收，内核继续运行；用户不能修改或读取受保护内存
- scenario: 构建与 CPU 配置
  input: 同目录重复构建、切换 TESTING 与链接选项，以及 CPUNUM=1 启动
  expected:
  - 无变化时产物时间戳不变；配置变化正确重建，默认镜像不残留测试代码
  - 单 hart 的首进程及中断正常运行，NCPU 与 QEMU 核数一致
