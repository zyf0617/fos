module: kernel/agent
authority: ../../../../AegisOS_ARCHITECTURE.md
stage: Lab5保护原型；不宣称已具备多进程调度或真实LLM运行能力
configuration:
  AEGIS: 默认0；1启用启动组、内存收费及系统调用权限/审计钩子
  AGENT_TEST: 默认0；1要求AEGIS=1，启用隔离测试镜像和故障注入
rules:
- 普通未入组进程保持课程路径；课程syscall编号0至7不变，不增加用户管理ABI。
- group由内核持有；初始化设置id、用户数据页限额、进程数限额及8位syscall允许集合；用户不能修改策略。
- attach在进程独占上下文检查成员数及初始页数，成功后发布归属；重复attach或超限失败且不改变状态。
- 当前启动进程在构造完成后以代码页和初始栈页共2页入组；页表页与trapframe不计入用户数据页预算。
- heap、stack及mmap分配先在组锁内预留整批页数；物理分配或建表失败归还预算；解除成功后归还对应预算。
- 每进程保留收费页数，组用量为所有成员收费之和；detach归还该成员剩余收费并清除归属，重复detach无操作。
- 独立页表复制暂不形成组内成员，未来fork必须将复制、配额预留、成员发布作为同一事务，不可直接复用为已隔离fork。
- syscall分派先验证64位编号，再检查允许集合；拒绝时不调用服务，mmap返回0，其他返回-1；未知编号返回-1。
- 审计使用64事件固定环；记录序号、硬件time、组号、pid、事件种类、详情、结果和组用量；满时覆盖最旧记录并通过读取接口报告丢失数。
- 审计热路径不打印、不分配，不记录用户字符串、地址或复制缓冲区；组锁释放后才取审计锁，避免反向锁序。
- syscall完成审计只保存成功0/失败-1，mmap/brk的成功地址不进入事件；用户故障仅保存scause，不保存stval。
- 地址空间只由当前拥有者hart修改，group计数和审计环各自受锁保护；本阶段不支持运行中的跨核迁移与并发detach。
acceptance:
- 组共享预算、成员数超限、重复加入、移除与预算复用；未入组进程不受策略影响。
- 实际heap/mmap/stack调用接入统一预算；配额拒绝与逐分配点OOM不改变原映射、元数据或预算。
- 实际syscall分派拒绝时不改目标缓冲区；高位非零的未知编号不绕过检查。
- 审计序号、覆盖丢失计数与读取上界准确；故障退出后的组成员、预算、页池和节点池全部回收。
- AEGIS=0课程Lab5/4/3通过；AEGIS=1课程用户负载与专用真实ecall演示通过。
functions:
  agent_init:
    pre: 启动核单次执行，尚无并发事件
    post: 初始化审计锁、序号和固定启动组，测试策略与默认策略分别编译
  agent_group_init:
    pre: 内核独占且尚无成员的存储；对象寿命覆盖所有成员；mask仅低8位
    post: 计数清零并设置锁与策略；不分配物理内存
  agent_attach:
    pre: 进程归属由调用者独占，initial_pages准确表示该成员已有数据页
    post: 成功0并发布组归属及收费；重复加入或超过页数/成员限制返回-1，计数不变
  agent_detach:
    pre: 成员地址空间已停止使用并完成资源销毁，且不存在并发入组或分配
    post: 归还该成员剩余收费和名额、记录移除并清除归属；无归属时无操作
  agent_charge:
    pre: 当前进程独占修改root；预留与对应提交/失败回滚在同一拥有者上下文完成
    post: 非当前root或未入组不收费并返回0；整批可容纳则增加组与成员计数，否则记录拒绝并返回-1
  agent_uncharge:
    pre: pages为本操作已释放或撤销的收费页数
    post: 当前成员计数和组计数同步扣除；无归属无操作；计数下溢属于内核错误并panic
  agent_allowed:
    pre: 有效进程，分派器已验证调用号
    post: 未入组放行；入组时锁内读取允许位，不执行服务
  agent_record:
    pre: 事件详情不含敏感数据；成员归属稳定，组锁不由调用者持有
    post: 未入组无操作；记录组计数快照和有序事件，满环覆盖最旧项
  agent_audit_read:
    pre: 内核out可写至少capacity个事件，或capacity为0；lost有效
    post: 返回after之后至多capacity个事件与可检测的丢失数；未来游标返回0且lost为0；不推进全局消费位置
  agent_audit_dump:
    pre: 内核诊断上下文；不能作为无界并发生产时的可靠持久化导出
    post: 在审计锁外打印保留事件及丢失数；读取不清空环
