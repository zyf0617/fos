module: user/initcode
owns:
- src/user/initcode.c
- src/user/sys.h
- src/user/syscall_arch.h
- src/user/syscall_num.h
rules:
- 用户调用通过 ecall，a7 为调用号、a0..a5 为参数、a0 为结果；内联汇编声明内存影响。
- SYS_helloworld=0；main 明确位于 USER_BASE，不能依赖编译器函数排列。
functions:
  long helloworld(void):
    effects:
    - 发起系统调用。
    post:
    - 经 ecall 发起 SYS_helloworld，返回内核结果。
  int main(void):
    effects:
    - 默认镜像展示hello、数组往返、字符串、brk、多页栈、mmap/munmap后报告demo PASS并循环。
    post:
    - 仍保持一页代码链接约束；测试镜像隔离场景并验证失败及动态资源回收。
lab5_delta:
- 默认用户演示copy、brk、多页栈及mmap/munmap后循环，syscall编号0..7统一。
- 测试场景分离镜像，保留用户代码一页断言；未知调用返回-1，失败不进行未授权访问。
