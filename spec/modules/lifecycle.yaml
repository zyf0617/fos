module: kernel/lifecycle
configuration:
  PROC_LIFECYCLE: 默认0；1启用本项目的单启动hart协作式生命周期；非课程Lab6规格
  PROC_PREEMPT: 默认0；1要求PROC_LIFECYCLE=1，仅用户timer返回前按就绪槽进行RR抢占
  RR_TEST: 默认0；1要求PROC_LIFECYCLE=1，专用无主动让出CPU的镜像，与PROC_TEST/课程测试/微基准互斥
  AGENT_SCHED: 默认0；1启用可信组管理与组间加权选择，要求AEGIS=1及用户timer抢占
  PROC_TEST: 默认0；1要求PROC_LIFECYCLE=1，替换用户镜像并提供仅测试故障注入调用200
owns:
- src/kernel/proc/lifecycle.c
- tests/process_user.c
- tests/test_process.py
- tests/rr_user.c
- tests/rr_context.S
- tests/test_rr.py
state:
  slots: 4个固定槽，各有proc资源、FREE/RUNNABLE/RUNNING/WAITING/ZOMBIE状态、PID、父指针、64位退出状态
  next_pid: 正PID单调增长，到0x7fffffff拒绝fork，不回绕；首进程PID0
  kernel_stacks: 启动时由kvm为每槽预映射一页RW内核栈，相邻保护页不映射；槽复用前清零；整个内核运行期保留
rules:
- 进程表仅boot_hartid拥有；所有状态变更与swtch时全局中断关闭且noff为0，不持有锁跨越切换；辅助hart留在内核，不访问进程表。
- PROC_PREEMPT=0时仅yield、wait、exit或不可恢复用户故障触发切换；1时只在用户timer处理完且锁已释放后检查其他RUNNABLE槽并抢占；内核trap/系统调用内部不抢占，不宣称SMP或组公平性。
- 调度器扫描RUNNABLE并设RUNNING，发布cpu.proc，切换到私有内核栈；返回后先清cpu.proc才销毁退出进程资源。
- 只保存整数现场，进入用户态显式将sstatus.FS/VS清零；浮点/向量指令不受支持，触发用户故障，不静默共享扩展寄存器。
- 僵尸保留退出记录直到父wait，动态地址空间、trapframe、组预算及成员名额在调度栈上立即回收；槽位仍占用直到wait或自动回收。
- 父退出时将所有子进程parent清空，已退出子进程的槽位自动归还，活跃孤儿继续运行并退出时自动归还；没有用户init收养或POSIX信号语义。
- 所有新增服务仍经过统一syscall权限分派；生命周期支持13位mask、组管理支持14位。AGENT_SCHED时仅初始槽有manager身份，任何复制均不继承；普通子任务只查本组。
functions:
  proc_lifecycle_run:
    pre: boot hart、关中断、无锁且cpu.proc为空；initial为完整首进程，组归属已准备
    post: 唯一转移initial资源到槽0并清空initial；全部任务退出且孤儿/僵尸收回后返回；尚有任务时不返回
  proc_fork:
    pre: 当前槽RUNNING，关中断、无锁；源资源由本hart稳定独占
    post: 空槽与正PID可用时经proc_clone_resources准备独立资源，绑定对应内核栈及trap_user_return上下文，再设RUNNABLE；父返回PID，子a0为0；任意失败返回-1，槽位/源/当前组用量不变
  proc_yield:
    pre: 当前槽RUNNING，关中断、无锁
    post: 设RUNNABLE，保存内核上下文并切回CPU栈；将来同槽RUNNING后继续返回
  proc_timer_tick:
    pre: PROC_PREEMPT=1，当前用户整数现场及epc已保存，时钟处理完成，关中断、无锁、当前槽RUNNING
    post: 增加当前任务用户timer样本计数；有其他RUNNABLE槽时累计实际抢占并suspend为RUNNABLE，否则不切换；不推进用户epc，恢复后由trap_user_return重新安装返回现场
  proc_wait:
    pre: 当前槽RUNNING，关中断、无锁；status为用户8字节可写缓冲区地址，0表示忽略
    post: 任一直接子进程ZOMBIE时先复制状态再释放槽并返回PID；复制失败-1并保留退出记录，允许已写前缀；无子进程-1；有子且未退出则WAITING，子退出后唤醒重试
  proc_exit:
    pre: 当前槽RUNNING，无锁；status为完整64位位模式
    post: 关中断，记录生命周期退出事件8，将槽设ZOMBIE并切回CPU上下文；不再恢复该任务；资源回收由调度栈完成
acceptance:
- make test-rr使用同一用户镜像的协作式负对照与四种抢占配置，验证两个无ecall/yield的CPU任务均在任意一方结束前启动，实际抢占各至少2次，任务独有寄存器模式恢复，退出后时钟继续；负对照串行。
- python3 tests/test_process.py --preempt运行抢占配置下的生命周期回归；计数只是功能样本，不作为精确CPU份额或公平性基准。
- make test-process在普通、完整审计、过滤成功事件、关闭审计四配置运行真实fork/exit/wait/yield/getpid，含父子内容独立和跨yield恢复。
- 覆盖坏指针/只读页/无U位/跨页状态写失败重试、子故障、未支持FP指令、4槽耗尽、单调PID复用、父退出时僵尸及活跃孤儿、孤儿继续fork/wait。
- 实际fork逐物理分配点失败不泄漏，至少一次成功；真实ABI下权限、页预算、成员上限均拒绝fork；退出后所有动态资源与组用量恢复，UART与ticks继续。
- 同目录关闭扩展后无proc_fork符号且原课程用户程序通过；非法配置拒绝；默认Lab3/4/5与Agent验收保持通过；VF2仅构建验收。

group_control:
- 13号agentctl的完整64位命令为0创建(policy指针)、1向指定组派生、2查询组(value为info指针、argument为组号，0指本组，非管理员只查本组)、3调整组权重(group,weight)、4删除空组(group)；未知命令或失败返回-1。
- policy为4个64位字段page_limit/process_limit/weight/syscall_mask；info为7个64位字段id/page_limit/pages/process_limit/processes/syscall_mask/weight；用户指针只经过uvm_copyin/out。
- 指定组派生复用proc_clone_resources_to_group，先向目标组预留全部页和一个成员，成功设置内核上下文后发布，失败目标全零且源不变；新进程无管理权。
- 组间选最小virtual_time，组内轮转成员；收费区间为swtch前后r_time差，按开始时权重归一，保留除法余数，最小非零收费；等待时间不收费。当前组改权重下一片生效。
- 先更新既有就绪组的进度，再将新建/唤醒组的virtual_time提升到当前进度；无其他旧就绪组时以刚结束区间的进度为准，避免单组长时间运行后给新组历史信用。
- 未启用组调度时按原进程槽循环RR，不增加组管理权限；内核处理仍不可抢占。
