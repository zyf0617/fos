module: kernel/process
owns:
- src/kernel/lib/cpu.c
- src/kernel/proc/proc.c
- src/kernel/proc/clone_test.c
- src/kernel/proc/swtch.S
- src/kernel/proc/type.h
- src/kernel/proc/method.h
state:
  cpus: 每hart的当前进程指针与保存的内核上下文；由OpenSBI交付并写入tp的hart ID索引，有效范围为0..NCPU-1。
  proczero: 默认课程路径的唯一用户进程，拥有用户页表、trapframe、用户代码页和栈页；使用预先映射的 KSTACK(0)。
  context_t: 依次为 ra、sp、s0..s11 的 64 位槽；C 与 swtch 汇编布局一致。
  user_trapframe_t: 288 字节：前五槽为 kernel_satp/kernel_sp/kernel_trap/epc/kernel_hartid，其后按给定头文件排列全部用户整数寄存器；a0 偏移112，t6偏移280。
  trapframe_alias: trapframe 页在用户页表中以 TRAPFRAME 出现（RW，不含 PTE_U）；内核页表不映射 TRAPFRAME，内核经恒等映射以物理地址访问同一页，proc.tf 保存该内核可见地址。
rules:
- 首进程构造完成前不得发布为运行状态；失败不留下半初始化进程。
- 虚拟地址零页不映射；TRAMPOLINE RX 和 TRAPFRAME RW 不含 PTE_U；用户代码 RXU、栈 RWU。
- 默认课程路径不引入多进程scheduler；PROC_LIFECYCLE扩展见lifecycle.yaml；首进程通过 swtch 与 trap_user_return 首次进入用户态。
- cpu.proc 只在页表、trapframe、用户栈与代码页全部就绪后写入一次；默认课程路径仅boot_hartid发布并运行proczero；扩展路径在同一hart上按槽切换。
functions:
  cpu_t *mycpu(void):
    pre:
    - 当前在S-mode，tp 保存 OpenSBI 交付的 hart ID 且位于 0..NCPU-1。
    effects: []
    post:
    - 返回 tp 对应的 cpus 元素；无效 hart id 是内核不变量错误。
  proc_t *myproc(void):
    pre:
    - 当前在S-mode，tp 保存有效 hart ID。
    effects: []
    post:
    - 返回当前 hart 的进程指针，允许 NULL；默认路径只在首进程构造后发布；扩展路径只在boot hart关中断时按槽更新，不发生迁移。
  pgtbl_t proc_pgtbl_init(uint64 trapframe):
    pre:
    - trapframe 为独占、页对齐的已分配内核物理页；物理分配器与 trampoline 已初始化。
    effects:
    - 分配清零根页表，将共享 trampoline 映射到 TRAMPOLINE（RX），将 trapframe 映射到 TRAPFRAME（RW）；两者均不含 PTE_U。
    post:
    - 成功返回独占的用户页表；零页和其他地址仍未映射，trapframe 与 trampoline 所有权不转移。
    - 分配或映射失败返回 NULL，回收本次根和中间页表页，保留调用者的 trapframe。
  int proc_clone_resources(proc_t *dst, const proc_t *src, int pid):
    pre:
    - dst全零且与src不同；src为合法完整的用户地址空间；调用者独占并稳定持有两者及组对象，源不在其他hart上运行或修改。
    effects:
    - 源有组时按实际用户叶页数在物理分配前通过agent_attach原子预留全部数据页及一个成员名额；组策略对象共享，不复制或扩权。
    - 复制独立trapframe、页表、全部用户页及mmap节点；内核栈与context保持零；用户寄存器复制但a0为0，内核相关trapframe四字段清零。
    post:
    - 成功0；目标只是未发布的资源快照，没有fork ABI或可运行状态，调用者未来需初始化内核栈/上下文并发布。
    - 失败-1，销毁目标资源、退还预算和成员，dst全零，源不变；峰值及attach/detach审计保留尝试历史。
  void proc_release_resources(proc_t *p):
    pre:
    - p有效且由调用者独占；不绑定当前cpu.proc，不在其他hart运行，内核页表生效。
    effects:
    - 先销毁用户页表，再detach、释放trapframe和mmap节点，最后将PCB清零；预映射内核栈不归本函数管理。
    post:
    - 动态资源与组预留归还；全零PCB可以重复调用，运行层须另行管理内核栈及进程槽位。
  void proc_make_first(void):
    pre:
    - boot_hartid 在 S-mode 执行，内核页表、KSTACK(0)、内存和 trap 已就绪；无已发布用户进程。
    - initcode 是从 USER_BASE 链接的平坦二进制，大小非零且不超过一页。
    effects:
    - 构造临时 PCB，分配内核 trapframe 与用户页表、代码页、栈页；代码为 RXU，栈为 RWU，用户零页不映射。
    - 设置 pid=0、heap_top=USER_BASE+PGSIZE、ustack_npage=1；初始用户 PC=USER_BASE、sp=TRAPFRAME。
    - ctx.ra 为 trap_user_return，ctx.sp 为 KSTACK(0)+PGSIZE；关中断后仅在所有资源完整时发布 cpu.proc，并通过 swtch 保存 CPU 上下文及启动进程。
    post:
    - 用户以独立页表和栈执行；默认路径正常用户循环期间本函数不返回；生命周期扩展在全部任务退出后返回。
    - 构造失败回收全部临时页，cpu.proc 保持 NULL，报告失败并返回内核主循环；不 panic。
    - 用户故障后恢复CPU上下文，清空cpu.proc，经uvm_destroy_pgtbl及节点池回收所有动态资源，trapframe恰好释放一次；启动预分配内核栈保留。
  void swtch(context_t *old, context_t *new):
    pre:
    - old/new 是互不重叠的可读写有效 context_t；目标 sp/ra 有效。
    effects:
    - 写 old 上下文，替换当前寄存器和控制流。
    post:
    - 保存当前 ra/sp/s0..s11 到 old，恢复 new 对应寄存器，经恢复的 ra 继续；old 将来被恢复时，本次调用才继续返回。
  void proc_return(void):
    pre:
    - S-mode、内核页表生效，当前 hart 存在已发布用户进程；不持有锁。
    effects:
    - 关闭中断，通过 swtch 保存进程内核上下文并恢复首进程创建前的 CPU 上下文。
    post:
    - 不再恢复故障用户执行，默认路径由恢复后的proc_make_first清理；生命周期扩展以状态-1进入proc_exit并在调度栈上回收；本入口不返回。
lab5_delta:
- proc新增mmap头指针；成功构造后发布；故障清理递归回收所有用户页和mmap节点，再单独归还trapframe；启动预分配内核栈保留。

group_clone_delta:
- AGENT_SCHED时proc_clone_resources_to_group由可信管理入口指定目标组，源稳定持有，向目标预留实际叶页数；复用同一复制/回滚实现，普通clone仍继承源组。
